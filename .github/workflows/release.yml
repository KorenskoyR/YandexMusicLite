name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric screenshot tests for SDK 35 need Java 21
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGRlBW9FXlekgbPrRHuSiA"
        run: ./gradlew assembleRelease --no-daemon

      - name: Check APK contents
        # The published APK must never carry signing material or local configuration
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          if unzip -l "$APK" | grep -iE '\.(jks|keystore|pem|p12|pfx)$|local\.properties|keystore\.properties|\.env$'; then
            echo "::error::Forbidden file found inside the APK"
            exit 1
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            • 🔍 **Масштаб интерфейса**: новая настройка в «Моя Музыка». Режим «Авто» сам подбирает масштаб для экранов с неверной плотностью (частая беда головных устройств в авто), есть и ручной ползунок 50–200%. Помогает, когда интерфейс слишком мелкий или крупный.
            • 🚗 **Режим «В авто» под сторону руля**: выберите, с какой стороны руль — в альбомной ориентации кнопки управления встают ближе к водителю, а обложка с дальней стороны. По умолчанию — левый руль.
            • 🛠 Мелкие исправления: очистка незавершённых загрузок, корректное обновление статуса подписки, устойчивость подгрузки чартов.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

