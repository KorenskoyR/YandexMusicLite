name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGR3485624001b979"
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            • 🎛 **Управление из шторки после закрытия приложения**: если выгрузить приложение из списка недавних, кнопки «вперёд/назад» в уведомлении и на гарнитуре продолжают работать, а треки сменяют друг друга без остановки.
            • 🔄 **Возврат в приложение без «холодного старта»**: при открытии сразу виден играющий трек, его прогресс и очередь. Последний трек запоминается и после перезапуска — Play продолжает с того же места.
            • ▶️ **Кнопка «Моя волна» всегда запускает волну**: исправлены случаи, когда нажатие Play ничего не включало, и пока трек загружается, на кнопке виден индикатор.
            • 🎚 **Кроссфейд 3 секунды при любом переключении**: и при автопереходе, и при «вперёд/назад», и при выборе трека из очереди. Пауза или перемотка во время перехода больше не оставляют два трека играть одновременно.
            • 🌐 **Устойчивость к обрывам сети**: после долгой паузы трек продолжается с того же места (ссылка обновляется автоматически), без сети приложение не перебирает всю очередь, а показывает сообщение.
            • 🚗 **Подсказки навигатора приглушают музыку**, а не ставят её на паузу.
            • 👎 «Не нравится» сразу переключает на следующий трек.
            • ⚡ Плавнее интерфейс во время воспроизведения.
            • 🛡 Безопасность: только HTTPS (кроме радиостанций, вещающих по HTTP), токены не попадают в логи и резервные копии.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

