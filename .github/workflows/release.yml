name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric screenshot tests for SDK 35 need Java 21
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGRlBW9FXlekgbPrRHuSiA"
        run: ./gradlew assembleRelease --no-daemon

      - name: Check APK contents
        # The published APK must never carry signing material or local configuration
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          if unzip -l "$APK" | grep -iE '\.(jks|keystore|pem|p12|pfx)$|local\.properties|keystore\.properties|\.env$'; then
            echo "::error::Forbidden file found inside the APK"
            exit 1
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            Интерфейс и движение:
            • ⚙️ Кнопка настроек — теперь шестерёнка (раньше её путали с эквалайзером).
            • ↩️ Окна, открытые из других, закрываются на шаг назад: «Профиль при запуске», «Сменить» и «Скачать всю коллекцию» возвращают в настройки, выбор плейлиста — в меню трека, «Новый плейлист» — к выбору плейлиста.
            • 🎛 Спектр вокруг центральной кнопки больше не крутится ни в какую сторону: полосы живут каждая в своём ритме, а при загрузке пульсируют вместе.
            • ▶️ Плеер следует за пальцем: потяните его вниз — он уезжает и закрывается; мини‑плеер можно потянуть вверх, и он раскроется в плеер.
            • ↩️ Жест «Назад» на Android 14+ показывает, куда вы вернётесь: плеер, плейлист и страницы артиста и альбома уменьшаются за пальцем.
            • 🎵 Смена трека — обложка и название въезжают с той стороны, откуда пришёл трек; страницы артиста и альбома открываются плавным сдвигом.
            • 📋 Очередь: треки можно переставлять (долгое нажатие и перетаскивание) и убирать свайпом влево.
            • ✨ Единая реакция на нажатие во всех списках и карточках; строки появляются по очереди, пока список загружается — вместо спиннеров заглушки по форме контента.
            • 🎚 Играющий трек в списках отмечен белым названием и эквалайзером; сердечко у понравившихся — всегда красное.
            • 💬 Пустые экраны и ошибки в одном стиле, с кнопкой «Повторить»; при появлении сети загрузка повторяется сама.
            • 🎛 «Моя волна»: карточки «Дальше в волне» всегда появляются сразу, кнопка «Плеер» открывает плеер, блок трека ближе к центральной кнопке.
            • 🔍 Индикаторы загрузки, полосы прогресса, тени и цвета — везде в стиле Hi‑Fi; экран ожидания сети тоже.
            Скорость и надёжность:
            • ⚡ Экраны перерисовываются меньше: каждая вкладка следит только за своими данными, в свёрнутом приложении подписки останавливаются.
            • 🛠 Исправлено: подгрузка волны больше не возвращает в очередь убранные вами треки.
            • 🧹 Код приложения разобран и упорядочен; все предупреждения анализатора устранены.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

