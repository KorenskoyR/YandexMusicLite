name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric screenshot tests for SDK 35 need Java 21
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGRlBW9FXlekgbPrRHuSiA"
          YANDEX_DEVICE_SECRET: ${{ secrets.YANDEX_DEVICE_SECRET }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check APK contents
        # The published APK must never carry signing material or local configuration
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          if unzip -l "$APK" | grep -iE '\.(jks|keystore|pem|p12|pfx)$|local\.properties|keystore\.properties|\.env$'; then
            echo "::error::Forbidden file found inside the APK"
            exit 1
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            Что нового:
            • ⚙️ Настройки разложены по разделам: «Аккаунт», «Воспроизведение», «Интерфейс», «О приложении». На магнитоле и на телефоне, повёрнутом боком, разделы открываются рядом со списком.
            • ▶️ При запуске: можно продолжить музыку или сразу включить «Мою волну», а также выбрать первый экран: последний раздел, «Моя волна» или «В авто». Плеер может раскрываться сам, когда вы включаете трек.
            • 🌊 «Моя волна» настраивается прямо на её экране: характер, настроение и язык. Появилась волна по треку: кнопка в плеере, первый пункт в меню трека «⋮» и кнопка в режиме «В авто». Вернуться можно кнопкой «К моей волне» или «Отменить».
            • 🚗 В режиме «В авто» кнопки волны в шапке, а панель настройки открывается поверх обложки и не закрывает управление. Часы и дату можно скрыть.
            • 🔉 Выравнивание громкости между треками, автозапуск при подключении Bluetooth машины, пропуск треков с ненормативной лексикой, системный эквалайзер, закрытие мини-плеера смахиванием, выбор анимаций.
            • 💾 Скачанные треки можно хранить на SD-карте. На карте они зашифрованы, и их слушает только это приложение.
            • 📱 Устройства без WebView, например магнитола Geely Galaxy L7, больше не закрываются на экране входа. Приложение объясняет, как включить WebView, или предлагает войти по коду с телефона. Если приложение закрылось с ошибкой ещё до входа, журнал сбоя можно отправить прямо с экрана входа.
            • Минимальная версия теперь Android 8.0.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

