name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGR3485624001b979"
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            • 🎧 **Play на наушниках и в машине после закрытия приложения**: кнопка Play на Bluetooth-гарнитуре, в автомобиле или в карточке медиа Android продолжает последний трек, даже если приложение было полностью закрыто.
            • 🎚 **Настройка кроссфейда**: длительность перехода между треками от 0 (выключен) до 12 секунд — «Моя музыка» → ⚙ Настройки.
            • 🔐 **Новое хранилище входа**: токены теперь защищены ключом Android Keystore. Аккаунты переносятся автоматически, повторно входить не нужно.
            • 🛡 **Безопасные обновления**: перед установкой приложение сверяет контрольную сумму с GitHub, подпись, имя пакета и номер версии.
            • ⚡ **Быстрее и экономнее**: ускоренный холодный старт (Baseline Profile), анимации эквалайзера и режима «В авто» больше не нагружают процессор каждый кадр, обложки используют общий кэш.
            • 🔧 Исправлено: переключатель «Авто-скачивание» нельзя было выключить.
            • 📱 Поддержка Android 16, тематическая иконка, жест «Назад» с предпросмотром, обновлены все библиотеки.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

