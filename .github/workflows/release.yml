name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Production keystore restored from secret."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_SALT: "XGR3485624001b979"
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/YandexMusicLite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/YandexMusicLite.apk
          generate_release_notes: false
          name: Yandex Music Lite ${{ github.ref_name }}
          body: |
            ### Yandex Music Lite ${{ github.ref_name }}

            • 100% защита и восстановление воспроизведения аудио (интегрирована защищённая соль подписи аудиопотоков)
            • Устранена ошибка 403 Forbidden: внедрён TTL и автоматический сброс устаревших ссылок при сбоях сети
            • Исправлена синхронизация экрана «Мне нравится»: исключено подмешивание чужих треков и ложные fallback-запросы
            • Полная изоляция персонального кэша при добавлении новых пользователей в режиме мультиаккаунта
            • Устранены утечки сокетов и сетевых дескрипторов при прерывании фоновых загрузок
            • Поиск стал плавным и быстрым благодаря отмене устаревших задач и debounce-фильтрации
            • Гарантированный откат локального состояния библиотеки при сбоях установки лайков
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

